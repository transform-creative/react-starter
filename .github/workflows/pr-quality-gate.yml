name: 🛡️ PR Quality Gate

# Trigger on Pull Requests targeting main
on:
  pull_request:
    branches: [ "main" ]

# Cancel previous runs if the user pushes new commits to the same PR
# (Saves you money/time on GitHub Actions minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the gate only reads code. Without this block the token gets
# the repo's default permissions, which may include write access.
permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: 🔍 Validate Code
    runs-on: ubuntu-latest
    
    steps:
      # 1. Checkout the code
      # fetch-depth: 0 — gitleaks scans the PR's commit range (<base>^..<head>).
      # A default shallow clone has no parent commit, so it fails every PR with
      # "ambiguous argument ... unknown revision".
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. Setup Node environment
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm' # Automatically caches node_modules for speed

      # 3. Clean Install (npm ci is faster/safer than npm install for CI)
      - name: Install Dependencies
        run: npm ci

      # 4. EXPERT ADDITION: Secret Scanning
      # Ensures no one accidentally committed a supabase_service_key
      - name: 🔑 GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments need pull-requests: write; findings still fail the job
          # and show in the log + SARIF artifact.
          GITLEAKS_ENABLE_COMMENTS: false

      # 5. EXPERT ADDITION: Linting
      # Catches bad code patterns (e.g. unused vars, bad useEffect deps)
      - name: 🎨 Lint Code (ESLint)
        run: npm run lint
        # Note: Ensure your package.json script is "lint": "eslint ."

      # 6. YOUR REQUIREMENT: Type Checking
      # Vite ignores TS errors in dev; this forces a check. `typecheck` runs
      # react-router typegen first — bare tsc can't see the generated +types.
      - name: 📐 Type Check (TypeScript)
        run: npm run typecheck

      - name: 🧪 Run Tests (Vitest)
        run: npm test

      # 7. YOUR REQUIREMENT: Security Vulnerabilities
      # We check ONLY production dependencies with high severity.
      # Checking dev-deps often causes false positives that break builds unnecessarily.
      - name: 🛡️ Security Audit
        run: npm audit --omit=dev --audit-level=high